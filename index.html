<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gohan Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
            touch-action: manipulation;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
        }

        #screen {
            width: 100%;
            height: 55%;
            background-color: #9bbc0f;
            border: 4px solid #0f380f;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #controls {
            width: 100%;
            height: 40%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            background-color: #d11;
            color: white;
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px #800;
        }

        .btn:active {
            box-shadow: 0 0 #800;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen">
        <h1 style="color: #0f380f;">GOHAN GAME</h1>
    </div>

    <div id="controls">
        <button class="btn">A</button>
        <button class="btn">B</button>
    </div>
</div>

</body>
</html>
